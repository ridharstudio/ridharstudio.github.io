<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Download Zikir Indonesia TV</title>
  <meta name="description" content="Download aplikasi Zikir Indonesia TV di Google Play melalui halaman browser aman agar tetap membuka versi web Play Store." />
  <meta name="robots" content="noindex, nofollow" />
  <meta http-equiv="refresh" content="0; url=https://play.google.com/store/apps/details?id=com.zikirindonesia.tv&hl=id&gl=US" />
  <style>
    :root {
      --bg: #0b1020;
      --card: #111a2a;
      --card-2: #17263d;
      --text: #f4f7fb;
      --muted: #bfd0ea;
      --primary: #6ec5ff;
      --primary-2: #8ef0c7;
      --border: rgba(255,255,255,0.08);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: linear-gradient(135deg, #0b1020 0%, #101d33 100%);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .card {
      width: min(100%, 520px);
      background: rgba(17, 26, 42, 0.92);
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: 0 24px 80px rgba(0,0,0,0.35);
      padding: 28px 24px;
      text-align: center;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 68px;
      height: 68px;
      border-radius: 18px;
      background: linear-gradient(135deg, var(--primary), var(--primary-2));
      color: #07131c;
      font-weight: 800;
      font-size: 28px;
      margin-bottom: 16px;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.9rem, 5vw, 2.6rem);
      line-height: 1.15;
    }

    p {
      margin: 14px auto 0;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.7;
      max-width: 40ch;
    }

    .actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 24px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-block;
      background: linear-gradient(135deg, var(--primary), var(--primary-2));
      color: #06131a;
      text-decoration: none;
      font-weight: 800;
      border-radius: 12px;
      padding: 14px 20px;
      min-width: 200px;
      box-shadow: 0 10px 24px rgba(110, 197, 255, 0.28);
    }

    .btn.secondary {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
      box-shadow: none;
    }

    .hint {
      margin-top: 18px;
      font-size: 0.82rem;
      color: rgba(255,255,255,0.7);
    }
  </style>
</head>
<body>
  <main class="card" aria-live="polite">
    <div class="badge">TV</div>
    <h1>Download Zikir Indonesia TV</h1>
    <p>Anda akan diarahkan ke halaman Google Play versi browser untuk melanjutkan install aplikasi.</p>

    <div class="actions">
      <a class="btn" href="https://play.google.com/store/apps/details?id=com.zikirindonesia.tv&hl=id&gl=US">Buka Google Play</a>
      <a class="btn secondary" href="https://play.google.com/store/apps/details?id=com.zikirindonesia.tv&hl=id&gl=US" target="_blank" rel="noopener noreferrer">Buka di tab baru</a>
    </div>

    <div class="hint">Jika tidak otomatis berpindah, klik tombol di atas.</div>
  </main>

  <script>
    (function () {
      const playUrl = "https://play.google.com/store/apps/details?id=com.zikirindonesia.tv&hl=id&gl=US";
      const userAgent = navigator.userAgent || "";
      const isAndroid = /Android/i.test(userAgent);

      if (isAndroid) {
        window.location.replace(playUrl);
      } else {
        window.location.href = playUrl;
      }
    })();
  </script>
</body>
</html>
