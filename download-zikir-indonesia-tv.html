<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Download Zikir Indonesia TV</title>
  <meta name="description" content="Download aplikasi Zikir Indonesia TV di Google Play melalui halaman browser aman agar tetap membuka versi web Play Store." />
  <meta name="robots" content="noindex, nofollow" />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #ffffff;
      --text: #0b0f14;
      --muted: #6b7582;
      --accent: #0b1220;
      --hr: #eef2f5;
      --panel: #ffffff;
      --border: #e7ebf0;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, "Roboto Mono", monospace;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 48px 18px;
    }

    .wrap {
      width: min(100%, 760px);
    }

    .header {
      display: flex;
      align-items: center;
      gap: 18px;
      margin-bottom: 28px;
    }

    .logo {
      width: 56px;
      height: 56px;
      border-radius: 8px;
      display: inline-grid;
      place-items: center;
      background: #f7f7f8;
      border: 1px solid #eceff1;
      color: var(--text);
      font-weight: 700;
      font-size: 20px;
    }

    .title {
      margin: 0;
      font-size: clamp(2.1rem, 5vw, 3.1rem);
      line-height: 1.04;
      letter-spacing: -0.02em;
    }

    .subtitle {
      margin-top: 6px;
      color: var(--muted);
      font-size: 14px;
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 28px 24px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.04);
    }

    .lead {
      margin: 0;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.8;
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      max-width: 52ch;
    }

    .actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 26px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-block;
      text-decoration: none;
      border-radius: 8px;
      padding: 10px 14px;
      min-width: 180px;
      text-align: center;
      border: 1px solid #e6e9ee;
      background: #ffffff;
      color: var(--text);
      font-weight: 700;
      font-size: 13px;
      font-family: Inter, sans-serif;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
    }

    .btn.primary {
      background: var(--text);
      border-color: var(--text);
      color: #ffffff;
      box-shadow: 0 8px 16px rgba(11, 15, 20, 0.12);
    }

    .divider {
      height: 1px;
      background: var(--hr);
      margin: 28px 0;
      border-radius: 1px;
    }

    .hint {
      margin-top: 18px;
      color: var(--muted);
      font-size: 12px;
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      text-align: center;
    }

    @media (max-width: 640px) {
      .header { margin-bottom: 18px; }
      .card { padding: 22px 18px; }
      .actions { display: grid; grid-template-columns: 1fr; }
      .btn { min-width: 0; width: 100%; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="header">
      <div class="logo">TV</div>
      <div>
        <h1 class="title">Zikir Indonesia TV</h1>
        <div class="subtitle">Download via Google Play</div>
      </div>
    </header>

    <main class="card" aria-live="polite">
      <p class="lead">Klik tombol di bawah untuk membuka halaman Google Play di browser. Disana anda bisa memilih diperangkat android mana yang ingin anda install.</p>

      <div class="actions">
        <a class="btn primary" href="https://play.google.com/store/apps/details?id=com.zikirindonesia.tv&hl=id&gl=US" target="_blank" rel="noopener noreferrer">Buka di browser</a>
      </div>

      <div class="divider"></div>
      <div class="hint">Halaman ini dibuat agar user memilih secara manual untuk membuka Google Play di browser.</div>
    </main>
  </div>
</body>
</html>
